<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Claude Chat Sessions</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: auto; padding: 20px; }
        #chat { border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
        .msg.user { color: blue; }
        .msg.assistant { color: green; }
        .msg { margin: 5px 0; }
        #sessionSelector { margin-left: 10px; margin-right: 10px; }
        input#message { width: 70%; padding: 5px; }
    </style>
</head>
<body>

<h1>Computer Use Demo (FastAPI + Claude)</h1>

<div>
    <button id="createBtn">Create New Session</button>
    <span><b>Current Session ID:</b> <span id="session-id">None</span></span>
</div>

<div style="margin-top: 10px;">
    <label for="sessionSelector">Select Session:</label>
    <select id="sessionSelector"></select>
    <button id="loadHistoryBtn">Load History</button>
</div>

<div id="chat"></div>

<div style="margin-top: 10px;">
    <input type="text" id="message" placeholder="Type a message" />
    <button id="sendBtn">Send</button>
</div>
<!-- VNC Section -->
<div style="margin-top: 10px;">
    <button id="vncBtn">Open VNC</button>
</div>

<div id="vncContainer" style="display:none;">
    <iframe id="vncFrame" width="800" height="600"></iframe>
</div>

<script src="/static/app.js"></script>
</body>
</html>
